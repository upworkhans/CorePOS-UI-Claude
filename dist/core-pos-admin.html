<title>Core POS Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Core POS Admin
   Layout: fixed ink sidebar (grouped modules) + top bar carrying the hierarchy scope
   (Region › Country › Brand › Store) + a work area of panels, tables and drawers. */
:root {
  --bg: #f3f5f4;            /* page ground, faintly green-grey like till paper under light */
  --surface: #ffffff;
  --surface-2: #f7f9f8;
  --line: #dde3e0;
  --line-strong: #c4cdc9;
  --fg: #14211d;
  --fg-2: #4a5853;
  --fg-3: #75837e;
  --accent: #0d6b57;        /* jade: primary actions, selection */
  --accent-ink: #ffffff;
  --accent-soft: #e2f1ec;
  --scope: #b45f06;         /* amber: the active hierarchy scope */
  --scope-soft: #fbefe1;
  --side: #0f1c19;
  --side-fg: #c9d6d1;
  --side-fg-2: #7f938c;
  --side-hover: #1a2c28;
  --good: #13804a; --good-soft: #e3f4ea;
  --warn: #a86300; --warn-soft: #fdf1dc;
  --bad: #c03a2b;  --bad-soft: #fbe7e4;
  --info: #2a62b8; --info-soft: #e5eefb;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;  /* chart series: NAM, EMEA, APAC */
  --shadow: 0 1px 2px rgba(15, 28, 25, .06), 0 8px 24px rgba(15, 28, 25, .06);
  --font: "Schibsted Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1513; --surface: #142019; --surface-2: #18251f; --line: #24342e; --line-strong: #33463f;
    --fg: #e6eeea; --fg-2: #a9b8b2; --fg-3: #7b8c86;
    --accent: #3fbf9a; --accent-ink: #06231b; --accent-soft: #173a30;
    --scope: #f0a548; --scope-soft: #3a2a14;
    --side: #08100e; --side-fg: #c2d0ca; --side-fg-2: #6f837c; --side-hover: #13211d;
    --good: #4cc887; --good-soft: #143426; --warn: #f0b04a; --warn-soft: #3a2c12;
    --bad: #f07a6c; --bad-soft: #3d1c18; --info: #79a8f0; --info-soft: #182a45;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1513; --surface: #142019; --surface-2: #18251f; --line: #24342e; --line-strong: #33463f;
  --fg: #e6eeea; --fg-2: #a9b8b2; --fg-3: #7b8c86;
  --accent: #3fbf9a; --accent-ink: #06231b; --accent-soft: #173a30;
  --scope: #f0a548; --scope-soft: #3a2a14;
  --side: #08100e; --side-fg: #c2d0ca; --side-fg-2: #6f837c; --side-hover: #13211d;
  --good: #4cc887; --good-soft: #143426; --warn: #f0b04a; --warn-soft: #3a2c12;
  --bad: #f07a6c; --bad-soft: #3d1c18; --info: #79a8f0; --info-soft: #182a45;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; font-weight: 650; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.6rem; line-height: 1.2; }
h2 { font-size: 1.05rem; }
h3 { font-size: .95rem; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--mono); font-size: .86em; letter-spacing: -.01em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-3); }
.small { font-size: .82rem; }
.eyebrow { font-size: .7rem; text-transform: uppercase; letter-spacing: .09em; color: var(--fg-3); font-weight: 600; }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side); color: var(--side-fg); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
.brandmark { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; }
.brandmark .logo { width: 30px; height: 30px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font-family: var(--mono); font-weight: 600; font-size: 13px; }
.brandmark b { display: block; font-size: 15px; color: #fff; letter-spacing: .02em; }
.brandmark span { font-size: 11px; color: var(--side-fg-2); }
.tenant { margin: 0 12px 12px; padding: 10px 12px; border: 1px solid var(--side-hover); border-radius: var(--r); font-size: 12px; }
.tenant b { color: #fff; font-weight: 600; display: block; font-size: 13px; }
.nav { padding: 4px 8px 24px; display: grid; gap: 14px; }
.nav-group > .eyebrow { color: var(--side-fg-2); padding: 0 10px 4px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; color: var(--side-fg); text-decoration: none; font-size: 13.5px; }
.nav a:hover { background: var(--side-hover); color: #fff; }
.nav a.active { background: var(--side-hover); color: #fff; box-shadow: inset 2px 0 0 var(--accent); }
.nav a svg { width: 16px; height: 16px; flex: none; opacity: .8; }
.nav a .count { margin-left: auto; font-size: 11px; font-family: var(--mono); background: var(--bad); color: #fff; border-radius: 10px; padding: 0 6px; }
.side-foot { margin-top: auto; padding: 12px 18px 18px; font-size: 11.5px; color: var(--side-fg-2); border-top: 1px solid var(--side-hover); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 10px 24px; flex-wrap: wrap; }
.menu-btn { display: none; }
.scope { display: flex; align-items: center; gap: 2px; background: var(--scope-soft); border: 1px solid color-mix(in srgb, var(--scope) 35%, transparent); border-radius: 8px; padding: 3px; flex-wrap: wrap; min-width: 0; }
.scope .lbl { font-size: 11px; font-weight: 700; color: var(--scope); text-transform: uppercase; letter-spacing: .08em; padding: 0 8px 0 6px; }
.scope select { appearance: none; border: 0; background: transparent; padding: 4px 22px 4px 8px; border-radius: 5px; font-weight: 550; font-size: 13px; cursor: pointer; background-image: linear-gradient(45deg, transparent 50%, var(--fg-3) 50%), linear-gradient(135deg, var(--fg-3) 50%, transparent 50%); background-position: calc(100% - 11px) 55%, calc(100% - 7px) 55%; background-size: 4px 4px; background-repeat: no-repeat; max-width: 190px; }
.scope select:hover { background-color: var(--surface); }
.scope .sep { color: var(--fg-3); font-size: 12px; }
.search { flex: 1; min-width: 180px; max-width: 380px; position: relative; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 7px 10px 7px 32px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--fg-3); }
.search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: 11px; color: var(--fg-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--surface); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.env { font-family: var(--mono); font-size: 11px; padding: 3px 8px; border-radius: 5px; background: var(--bad-soft); color: var(--bad); font-weight: 600; letter-spacing: .03em; }
.iconbtn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; position: relative; }
.iconbtn svg { width: 17px; height: 17px; }
.iconbtn .dot { position: absolute; top: 6px; right: 7px; width: 7px; height: 7px; background: var(--bad); border-radius: 50%; border: 2px solid var(--surface); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 12px; }

.page { padding: 22px 24px 48px; display: grid; gap: 18px; max-width: 1480px; width: 100%; }
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head .titles { min-width: 0; flex: 1 1 340px; display: grid; gap: 4px; }
.page-head .titles p { color: var(--fg-2); max-width: 75ch; }
.crumbs { font-size: 12px; color: var(--fg-3); display: flex; gap: 6px; flex-wrap: wrap; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.scope-note svg { width: 13px; height: 13px; flex: none; }
.scope-note { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--scope); background: var(--scope-soft); padding: 2px 8px; border-radius: 5px; font-weight: 550; }

/* ---------- Primitives ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); padding: 7px 12px; border-radius: 7px; cursor: pointer; font-weight: 550; font-size: 13px; white-space: nowrap; text-decoration: none; color: var(--fg); }
.btn:hover { border-color: var(--fg-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn svg { width: 15px; height: 15px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.panel-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-h .sub { color: var(--fg-3); font-size: 12.5px; }
.panel-h .actions { margin-left: auto; }
.panel-b { padding: 16px; }
.panel-b.flush { padding: 0; }

.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-2-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.g-1-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
.g-rc { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: start; }
.g-2-1, .g-1-2 { align-items: start; }
.stack { display: grid; gap: 12px; align-content: start; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

.kpi { padding: 14px 16px; display: grid; gap: 2px; }
.kpi .v { font-size: 1.55rem; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi .d { font-size: 12px; display: flex; gap: 6px; align-items: center; color: var(--fg-3); }
.up { color: var(--good); font-weight: 600; } .down { color: var(--bad); font-weight: 600; }
.kpi svg.spark { width: 100%; height: 30px; margin-top: 6px; }

.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--fg-2); border: 1px solid var(--line); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.plain::before { display: none; }
.badge.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.badge.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.badge.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.tag { font-family: var(--mono); font-size: 11.5px; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg-2); white-space: nowrap; }
.flag { display: inline-grid; place-items: center; width: 26px; height: 18px; border-radius: 3px; font-family: var(--mono); font-size: 10px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--fg-2); flex: none; }
.lock { color: var(--scope); font-size: 12px; font-weight: 600; display: inline-flex; gap: 4px; align-items: center; }

.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--fg-3); font-weight: 600; padding: 9px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); }
.tbl td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover td { background: var(--surface-2); }
.tbl tr.click { cursor: pointer; }
.sortbtn { all: unset; cursor: pointer; font: inherit; letter-spacing: inherit; text-transform: inherit; }
.sortbtn:hover { color: var(--fg); }
.sortbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tbl td.r, .tbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .strong { font-weight: 600; }
.cell-sub { font-size: 12px; color: var(--fg-3); }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.input, select.input, textarea.input { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 7px; padding: 7px 10px; min-width: 0; }
.input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); border-color: var(--accent); }
.field { display: grid; gap: 5px; }
.field > label { font-size: 12.5px; font-weight: 600; color: var(--fg-2); }
.field .hint { font-size: 12px; color: var(--fg-3); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; }
.chip.on { background: var(--fg); color: var(--surface); border-color: var(--fg); }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; padding: 0 12px; }
.tabs button { border: 0; background: none; padding: 11px 12px; cursor: pointer; font-weight: 550; color: var(--fg-3); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-size: 13px; }
.tabs button.on { color: var(--fg); border-bottom-color: var(--accent); }

.switch { position: relative; width: 36px; height: 20px; flex: none; display: inline-block; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; background: var(--line-strong); border-radius: 20px; cursor: pointer; transition: .15s; }
.switch span::after { content: ""; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.kv { display: grid; grid-template-columns: minmax(120px, 40%) 1fr; gap: 8px 14px; font-size: 13px; }
.kv dt { color: var(--fg-3); }
.kv dd { margin: 0; font-weight: 550; min-width: 0; overflow-wrap: anywhere; }

.list { display: grid; }
.list-item { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); align-items: flex-start; }
.list-item:last-child { border-bottom: 0; }
.list-item .grow { flex: 1; min-width: 0; }
.sev { width: 4px; align-self: stretch; border-radius: 4px; flex: none; }
.sev.critical { background: var(--bad); } .sev.serious { background: #d9701f; } .sev.warning { background: var(--warn); } .sev.info { background: var(--info); }

.meter { height: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 6px; }

.empty-note { padding: 14px 16px; font-size: 12.5px; color: var(--fg-3); background: var(--surface-2); border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; }
.callout { display: flex; gap: 10px; padding: 12px 14px; border-radius: 8px; background: var(--info-soft); color: var(--fg); font-size: 13px; border: 1px solid color-mix(in srgb, var(--info) 25%, transparent); }
.callout.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.callout b { font-weight: 650; }

/* Hierarchy tree */
.tree { font-size: 13.5px; padding: 8px; }
.tree details { margin-left: 14px; }
.tree > details { margin-left: 0; }
.tree summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; }
.tree summary::-webkit-details-marker { display: none; }
.tree summary::before { content: "▸"; color: var(--fg-3); font-size: 11px; width: 10px; transition: transform .15s; }
.tree details[open] > summary::before { transform: rotate(90deg); }
.tree summary:hover, .tree .leaf:hover { background: var(--surface-2); }
.tree summary.sel, .tree .leaf.sel { background: var(--scope-soft); color: var(--scope); font-weight: 600; }
.tree .leaf { display: flex; align-items: center; gap: 8px; padding: 5px 8px 5px 26px; margin-left: 14px; border-radius: 6px; cursor: pointer; }
.tree .lvl { font-size: 10px; font-family: var(--mono); color: var(--fg-3); margin-left: auto; text-transform: uppercase; }

/* Config inheritance cascade */
.cascade { display: grid; gap: 0; }
.cascade .lv { display: grid; grid-template-columns: 110px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 11px 14px; border-left: 2px solid var(--line-strong); margin-left: 10px; position: relative; }
.cascade .lv::before { content: ""; position: absolute; left: -7px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line-strong); }
.cascade .lv.set::before { background: var(--accent); border-color: var(--accent); }
.cascade .lv.eff { background: var(--accent-soft); border-radius: 0 8px 8px 0; }
.cascade .lv .val { font-family: var(--mono); font-size: 13px; }
.cascade .lv .inh { color: var(--fg-3); font-style: italic; font-family: var(--font); }

/* Integration cards */
.int-card { padding: 14px 16px; display: grid; gap: 10px; align-content: start; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.int-card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.int-logo { width: 38px; height: 38px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg); font-family: var(--mono); }
.int-card p { color: var(--fg-2); font-size: 12.5px; }

/* Receipt preview */
.receipt { background: #fffef9; color: #1d1d1b; font-family: var(--mono); font-size: 11.5px; line-height: 1.45; width: 300px; max-width: 100%; margin: 0 auto; padding: 18px 16px 22px; box-shadow: var(--shadow); border-radius: 2px; position: relative; }
.receipt::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px; background: linear-gradient(-45deg, transparent 6px, #fffef9 0) 0 0/12px 12px, linear-gradient(45deg, transparent 6px, #fffef9 0) 0 0/12px 12px; }
.receipt .c { text-align: center; }
.receipt .rule { border-top: 1px dashed #9a9a92; margin: 8px 0; }
.receipt .ln { display: flex; justify-content: space-between; gap: 8px; }
.receipt .b { font-weight: 700; }
.receipt .qr { width: 78px; height: 78px; margin: 10px auto 4px; background:
  conic-gradient(#1d1d1b 25%, transparent 0 50%, #1d1d1b 0 75%, transparent 0) 0 0/13px 13px; border: 6px solid #1d1d1b; }
.receipt .hl { background: #fdf0c8; outline: 1px dashed #c99a1a; }

/* Matrix */
.matrix th.rot { white-space: nowrap; font-size: 10.5px; text-transform: none; letter-spacing: 0; text-align: center; }
.matrix td.ck { text-align: center; }
.matrix input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }

/* Chart */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--fg-3); font-size: 11px; font-family: var(--font); }
.chart .grid line { stroke: var(--line); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--fg-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

      <thead><tr>${cols.map((c) => `<th class="${c.r ? 'r' : ''}">${c.h}</th>`).join('')}</tr></thead>
      <tbody>${rows.map((r, i) => `<tr ${opts.rowAttr ? opts.rowAttr(r, i) : ''}>${cols.map((c) => `<td class="${c.r ? 'r' : ''}">${c.f(r, i)}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>`;

  CP.spark = (vals, color = 'var(--accent)') => {
    const w = 120, h = 30, max = Math.max(...vals), min = Math.min(...vals);
    const pts = vals.map((v, i) => [(i / (vals.length - 1)) * (w - 4) + 2, h - 3 - ((v - min) / (max - min || 1)) * (h - 8)]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const last = pts[pts.length - 1];
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
      <path d="${d} L${last[0]} ${h} L2 ${h} Z" fill="${color}" opacity=".12"/>
      <path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${color}"/></svg>`;
  };

  CP.switch = (id, on, label = '') => `<label class="switch" title="${CP.esc(label)}"><input type="checkbox" id="${id}" ${on ? 'checked' : ''} aria-label="${CP.esc(label)}"><span></span></label>`;

  CP.pageHead = ({ crumbs, title, desc, actions = '', scoped = true }) => `
    <div class="page-head">
      <div class="titles">
        <div class="crumbs">${crumbs.map(CP.esc).join(' <span>/</span> ')}</div>
        <h1>${CP.esc(title)}</h1>
        ${desc ? `<p>${desc}</p>` : ''}
        ${scoped ? `<div><span class="scope-note">${CP.icon('tree', '')}Showing ${CP.esc(CP.scopeLabel())}</span></div>` : ''}
      </div>
      <div class="actions">${actions}</div>
    </div>`;

  /* ---------- Hierarchy scope (Region › Country › Brand › Store) ---------- */
  CP.scope = { region: '', country: '', brand: '', store: '' };
  CP.inScope = (s) => {
    const c = CP.country(s.country);
    const sc = CP.scope;
    return (!sc.region || c.region === sc.region) && (!sc.country || s.country === sc.country) && (!sc.brand || s.brand === sc.brand) && (!sc.store || s.code === sc.store);
  };
  CP.countriesInScope = () => D.countries.filter((c) => (!CP.scope.region || c.region === CP.scope.region) && (!CP.scope.country || c.id === CP.scope.country));
  CP.scopeLabel = () => {
    const sc = CP.scope, parts = [];
    if (sc.store) return sc.store + ' · ' + (D.stores.find((s) => s.code === sc.store) || {}).name;
    parts.push(sc.region || 'All regions');
    if (sc.country) parts.push(CP.country(sc.country).name);
    parts.push(sc.brand ? CP.brand(sc.brand).name : 'all brands');
    return parts.join(' › ');
  };
  CP.scopeLevel = () => (CP.scope.store ? 'Store' : CP.scope.country ? 'Country' : CP.scope.region ? 'Region' : 'Global');

  function renderScope() {
    const sc = CP.scope;
    const opt = (v, l, sel) => `<option value="${v}" ${sel === v ? 'selected' : ''}>${CP.esc(l)}</option>`;
    const countries = D.countries.filter((c) => !sc.region || c.region === sc.region);
    const stores = D.stores.filter((s) => (!sc.region || CP.country(s.country).region === sc.region) && (!sc.country || s.country === sc.country) && (!sc.brand || s.brand === sc.brand));
    document.getElementById('scope').innerHTML = `
      <span class="lbl">Scope</span>
      <select id="sc-region" aria-label="Region">${opt('', 'All regions', sc.region)}${D.regions.map((r) => opt(r.id, r.id, sc.region)).join('')}</select>
      <span class="sep">›</span>
      <select id="sc-country" aria-label="Country">${opt('', 'All countries', sc.country)}${countries.map((c) => opt(c.id, c.name, sc.country)).join('')}</select>
      <span class="sep">›</span>
      <select id="sc-brand" aria-label="Brand">${opt('', 'All brands', sc.brand)}${D.brands.map((b) => opt(b.id, b.name, sc.brand)).join('')}</select>
      <span class="sep">›</span>
      <select id="sc-store" aria-label="Store">${opt('', 'All stores', sc.store)}${stores.map((s) => opt(s.code, s.code, sc.store)).join('')}</select>`;
    const set = (k, reset) => (e) => {
      sc[k] = e.target.value;
      reset.forEach((r) => (sc[r] = ''));
      if (k === 'store' && sc.store) {
        const s = D.stores.find((x) => x.code === sc.store);
        sc.country = s.country; sc.region = CP.country(s.country).region; sc.brand = s.brand;
      }
      if (k === 'country' && sc.country) sc.region = CP.country(sc.country).region;
      renderScope();
      render();
    };
    document.getElementById('sc-region').onchange = set('region', ['country', 'store']);
    document.getElementById('sc-country').onchange = set('country', ['store']);
    document.getElementById('sc-brand').onchange = set('brand', ['store']);
    document.getElementById('sc-store').onchange = set('store', []);
  }
  CP.setScope = (patch) => { Object.assign(CP.scope, patch); renderScope(); render(); };

  /* ---------- Overlays ---------- */
  const layer = () => document.getElementById('layer');
  CP.closeOverlay = () => { layer().innerHTML = ''; document.removeEventListener('keydown', escClose); };
  function escClose(e) { if (e.key === 'Escape') CP.closeOverlay(); }
  CP.drawer = ({ title, sub = '', body, foot = '', mount }) => {
    layer().innerHTML = `<div class="scrim" data-close></div>
      <aside class="drawer" role="dialog" aria-modal="true" aria-label="${CP.esc(title)}">
        <div class="drawer-h"><div style="flex:1;min-width:0;display:grid;gap:4px">${sub ? `<div class="eyebrow">${sub}</div>` : ''}<h2 style="font-size:1.2rem">${CP.esc(title)}</h2></div>
        <button class="iconbtn" data-close aria-label="Close">${CP.icon('x')}</button></div>
        <div class="drawer-b">${body}</div>
        ${foot ? `<div class="drawer-f">${foot}</div>` : ''}
      </aside>`;
    layer().querySelectorAll('[data-close]').forEach((el) => (el.onclick = CP.closeOverlay));
    document.addEventListener('keydown', escClose);
    const d = layer().querySelector('.drawer');
    wire(d);
    mount && mount(d);
    d.querySelector('button, input, select')?.focus();
  };
  CP.confirm = ({ title, body, confirm = 'Confirm', danger = false, onConfirm }) => {
    layer().innerHTML = `<div class="scrim" data-close></div>
      <div class="modal" role="dialog" aria-modal="true" aria-label="${CP.esc(title)}">
        <div class="panel-b"><h2>${CP.esc(title)}</h2><div style="color:var(--fg-2)">${body}</div>
        <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn" data-close>Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" id="modal-ok">${CP.esc(confirm)}</button></div></div>
      </div>`;
    layer().querySelectorAll('[data-close]').forEach((el) => (el.onclick = CP.closeOverlay));
    document.addEventListener('keydown', escClose);
    const ok = document.getElementById('modal-ok');
    ok.focus();
    ok.onclick = () => { CP.closeOverlay(); onConfirm && onConfirm(); };
  };
  let toastT;
  CP.toast = (msg) => {
    let t = document.getElementById('toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2600);
  };

  /* Generic behaviours: tabs, chips, toast buttons, chart tooltips. */
  function wire(root) {
    root.querySelectorAll('[data-tabs]').forEach((tabs) => {
      const host = tabs.closest('[data-tabhost]') || tabs.parentElement;
      tabs.querySelectorAll('button[data-tab]').forEach((b) => (b.onclick = () => {
        tabs.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
        host.querySelectorAll('[data-pane]').forEach((p) => (p.hidden = p.dataset.pane !== b.dataset.tab));
      }));
    });
    root.querySelectorAll('[data-chips]').forEach((g) => g.querySelectorAll('.chip').forEach((c) => (c.onclick = () => {
      if (g.dataset.chips === 'multi') c.classList.toggle('on');
      else g.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === c));
      g.dispatchEvent(new CustomEvent('chips', { detail: c.dataset.v }));
    })));
    root.querySelectorAll('[data-toast]').forEach((b) => (b.onclick = () => CP.toast(b.dataset.toast)));
    root.querySelectorAll('[data-go]').forEach((b) => (b.onclick = (e) => { e.preventDefault(); location.hash = b.dataset.go; }));
    root.querySelectorAll('[data-tip]').forEach((el) => {
      el.addEventListener('mouseenter', showTip); el.addEventListener('mousemove', moveTip); el.addEventListener('mouseleave', hideTip);
      el.addEventListener('focus', showTip); el.addEventListener('blur', hideTip);
    });
  }
  CP.wire = wire;
  let tipEl;
  function showTip(e) {
    if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'tip'; document.body.appendChild(tipEl); }
    tipEl.innerHTML = e.currentTarget.dataset.tip; tipEl.hidden = false; moveTip(e);
  }
  function moveTip(e) {
    if (!tipEl) return;
    const r = e.currentTarget.getBoundingClientRect();
    const x = e.clientX || r.left + r.width / 2, y = e.clientY || r.top;
    tipEl.style.left = Math.min(x + 12, innerWidth - tipEl.offsetWidth - 8) + 'px';
    tipEl.style.top = Math.max(y - tipEl.offsetHeight - 12, 8) + 'px';
  }
  function hideTip() { if (tipEl) tipEl.hidden = true; }

  /* ---------- Navigation + router ---------- */
  CP.screens = CP.screens || {};
  const NAV = [
    ['Overview', [['dashboard', 'Command center', 'dashboard'], ['transactions', 'Transactions', 'receipt']]],
    ['Organisation', [['hierarchy', 'Hierarchy', 'tree'], ['stores', 'Stores', 'store'], ['config', 'Configuration', 'sliders'], ['rollout', 'Store rollout', 'rocket']]],
    ['Catalogue & pricing', [['products', 'Products', 'box'], ['pricing', 'Price lists', 'tag'], ['promotions', 'Promotions', 'percent']]],
    ['Tax & compliance', [['tax', 'Tax engine', 'landmark'], ['fiscal', 'Fiscalisation', 'shield'], ['receipts', 'Receipts & documents', 'receipt'], ['localization', 'Localisation', 'globe']]],
    ['Payments', [['payments', 'Payment providers', 'card'], ['tenders', 'Tender rules', 'coins']]],
    ['Customers', [['customers', 'Customer settings', 'customer'], ['privacy', 'Privacy requests', 'privacy']]],
    ['Operations', [['devices', 'Devices', 'device', 7], ['cash', 'Business day & cash', 'cash'], ['releases', 'Releases & flags', 'flag']]],
    ['Integrations', [['integrations', 'Integration hub', 'plug', 2], ['events', 'Events & webhooks', 'activity', 4]]],
    ['Finance & reports', [['reports', 'Reports', 'chart'], ['reconciliation', 'Reconciliation', 'scale', 3]]],
    ['Access & security', [['users', 'Users & roles', 'users'], ['audit', 'Audit log', 'file'], ['security', 'Security & SSO', 'key']]],
  ];
  CP.NAV = NAV;

  function renderNav() {
    document.getElementById('nav').innerHTML = NAV.map(([g, items]) => `
      <div class="nav-group"><div class="eyebrow">${g}</div>
      ${items.map(([id, label, ic, n]) => `<a href="#${id}" data-id="${id}">${CP.icon(ic)}<span>${label}</span>${n ? `<span class="count">${n}</span>` : ''}</a>`).join('')}
      </div>`).join('');
  }

  function current() {
    const h = location.hash.replace('#', '');
    return CP.screens[h] ? h : 'dashboard';
  }
  function render() {
    const id = current();
    const scr = CP.screens[id];
    const page = document.getElementById('page');
    page.innerHTML = scr.render();
    document.querySelectorAll('#nav a').forEach((a) => a.classList.toggle('active', a.dataset.id === id));
    wire(page);
    scr.mount && scr.mount(page);
    document.title = 'Core POS Admin';
  }
  CP.render = render;

  window.addEventListener('hashchange', () => {
    CP.closeOverlay();
    document.querySelector('.app').classList.remove('nav-open');
    render();
    document.querySelector('.main').scrollIntoView({ block: 'start' });
    window.scrollTo(0, 0);
  });

  document.addEventListener('DOMContentLoaded', () => {
    renderNav();
    renderScope();
    render();
    document.getElementById('menu-btn').onclick = () => document.querySelector('.app').classList.toggle('nav-open');
    document.getElementById('theme-btn').onclick = () => {
      const r = document.documentElement;
      const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      r.dataset.theme = dark ? 'light' : 'dark';
    };
    document.getElementById('bell').onclick = () => location.hash = 'dashboard';
    const q = document.getElementById('q');
    document.addEventListener('keydown', (e) => { if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') { e.preventDefault(); q.focus(); } });
    q.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const v = q.value.trim().toLowerCase();
      const store = D.stores.find((s) => s.code.toLowerCase() === v || s.name.toLowerCase().includes(v));
      const nav = NAV.flatMap((g) => g[1]).find((n) => n[1].toLowerCase().includes(v));
      if (nav) location.hash = nav[0];
      else if (store) { CP.setScope({ region: CP.country(store.country).region, country: store.country, brand: store.brand, store: store.code }); location.hash = 'stores'; }
      else CP.toast(`No module, store or setting matches “${q.value}”`);
    });
  });
})();
</script>
<script>
/* Screens: Command center, Organisation (hierarchy, stores, configuration, rollout),
   Catalogue & pricing (products, price lists, promotions). */
(function () {
  const D = CP.data, S = CP.screens, I = CP.icon, B = CP.badge, E = CP.esc;

  /* Share of the tenant inside the current scope, used to scale the example KPIs. */
  function scopeFactor() {
    if (CP.scope.store) return 1 / 205;
    const cs = CP.countriesInScope();
    let f = cs.reduce((a, c) => a + c.stores, 0) / 205;
    if (CP.scope.brand) f *= { ATL: 0.52, KES: 0.31, NOR: 0.17 }[CP.scope.brand];
    return f;
  }
  const fmtUSD = (n) => '$' + (n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : n.toFixed(0));

  /* ================= Command center ================= */
  function hourlyChart() {
    const H = D.hourly, regs = CP.scope.region ? [CP.scope.region] : ['NAM', 'EMEA', 'APAC'];
    const f = CP.scope.country || CP.scope.store || CP.scope.brand ? scopeFactor() * 3 : 1;
    const W = 640, Ht = 220, L = 40, R = 12, T = 12, Bm = 26;
    const max = 100, n = H.hours.length;
    const x = (i) => L + (i / (n - 1)) * (W - L - R);
    const y = (v) => T + (1 - v / max) * (Ht - T - Bm);
    const col = { NAM: 'var(--s1)', EMEA: 'var(--s2)', APAC: 'var(--s3)' };
    const grid = [0, 25, 50, 75, 100].map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}k</text>`).join('');
    const lines = regs.map((r) => {
      const vals = H[r].map((v) => v * Math.min(f, 1));
      const d = vals.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
      const li = vals.length - 1;
      return `<path d="${d}" fill="none" stroke="${col[r]}" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="${x(li)}" cy="${y(vals[li])}" r="4" fill="${col[r]}" stroke="var(--surface)" stroke-width="2"/>`;
    }).join('');
    const hits = H.hours.map((h, i) => {
      const tip = `<b>${h}:00 UTC</b><br>` + regs.map((r) => `${r}: ${fmtUSD(H[r][i] * Math.min(f, 1) * 1000)}`).join('<br>');
      const w = (W - L - R) / (n - 1);
      return `<rect x="${x(i) - w / 2}" y="${T}" width="${w}" height="${Ht - T - Bm}" fill="transparent" data-tip="${E(tip)}" tabindex="0"/>`;
    }).join('');
    const xl = H.hours.map((h, i) => (i % 2 ? '' : `<text x="${x(i)}" y="${Ht - 6}" text-anchor="middle">${h}:00</text>`)).join('');
    return `<div class="legend" style="padding:0 0 8px">${regs.map((r) => `<span><i style="background:${col[r]}"></i>${r}</span>`).join('')}<span class="muted">Net sales per hour, USD reporting currency (UTC)</span></div>
      <svg class="chart" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Hourly net sales by region"><g class="grid">${grid}</g>${lines}${xl}${hits}</svg>`;
  }

  S.dashboard = {
    render() {
      const f = scopeFactor();
      const sales = 2486000 * f, txn = Math.round(11940 * f), atv = sales / Math.max(txn, 1);
      const inScope = D.stores.filter(CP.inScope);
      const off = inScope.filter((s) => s.status === 'Offline').length, att = inScope.filter((s) => s.status === 'Attention').length;
      const kpi = (label, v, d, spark, col) => `<div class="panel kpi"><div class="eyebrow">${label}</div><div class="v">${v}</div><div class="d">${d}</div>${CP.spark(spark, col)}</div>`;
      const regRows = D.regions.filter((r) => !CP.scope.region || r.id === CP.scope.region).map((r, i) => {
        const pct = [0.92, 1.06, 0.98][i], col = ['var(--s1)', 'var(--s2)', 'var(--s3)'][i];
        return `<div class="region-row"><div><b>${r.id}</b><div class="cell-sub">${r.currency}</div></div>
          <div><div class="bar" data-tip="${E(`<b>${r.id}</b><br>${Math.round(pct * 100)}% of today's target`)}"><i style="width:${Math.min(pct, 1) * 100}%;background:${col}"></i></div>
          <div class="cell-sub" style="margin-top:4px">${Math.round(pct * 100)}% of daily target · ${['64% stores trading', '81% stores trading', 'all stores Z-closed'][i]}</div></div>
          <div class="num strong">${['$812k', '$1.21M', '$0.46M'][i]}</div></div>`;
      }).join('');
      return `
      ${CP.pageHead({ crumbs: ['Overview'], title: 'Command center', desc: 'Live trading, store health and integration status across every region you can see. Change the scope in the top bar to drill from global down to a single store.', actions: `<button class="btn" data-toast="Dashboard exported to Excel">${I('download')}Export</button><button class="btn" data-go="transactions">${I('receipt')}Transactions</button><button class="btn primary" data-go="reports">${I('chart')}Open reports</button>` })}
      <div class="grid g4">
        ${kpi('Net sales today', fmtUSD(sales), '<span class="up">▲ 6.4%</span> vs same day last year', [40, 42, 39, 47, 51, 49, 55, 58], 'var(--accent)')}
        ${kpi('Transactions', txn.toLocaleString('en-US'), '<span class="up">▲ 3.1%</span> · UPT 1.42', [30, 31, 35, 33, 36, 38, 37, 41], 'var(--accent)')}
        ${kpi('Average transaction', '$' + atv.toFixed(0), '<span class="down">▼ 1.2%</span> · CVR 18.6%', [52, 50, 51, 49, 50, 48, 49, 48], 'var(--accent)')}
        ${kpi('Stores trading', `${Math.round(117 * f * 205 / 205)} / ${Math.round(205 * f) || 1}`, `${off ? `<span class="down">${off} offline</span>` : '0 offline'} · ${att} need attention`, [60, 80, 120, 140, 150, 140, 130, 117], 'var(--accent)')}
      </div>
      <div class="grid g-2-1">
        <section class="panel"><div class="panel-h"><h2>Sales by hour</h2><span class="sub">Today, by region</span>
          <div class="actions"><div class="chips" data-chips><button class="chip on">Today</button><button class="chip">7 days</button><button class="chip">MTD</button></div></div></div>
          <div class="panel-b">${hourlyChart()}</div></section>
        <section class="panel"><div class="panel-h"><h2>Alerts</h2><span class="sub">${D.alerts.length} open</span><div class="actions"><button class="btn sm ghost" data-toast="All alerts acknowledged">Acknowledge all</button></div></div>
          <div class="list">${D.alerts.map((a) => `<div class="list-item"><span class="sev ${a.sev}"></span><div class="grow"><div class="row" style="gap:6px"><b>${E(a.title)}</b></div><div class="small muted">${E(a.detail)}</div></div><div class="stack" style="gap:4px;justify-items:end"><span class="small muted mono">${a.time}</span><button class="btn sm" data-go="${a.link}">View</button></div></div>`).join('')}</div></section>
      </div>
      <div class="grid g3">
        <section class="panel"><div class="panel-h"><h2>Region performance</h2><span class="sub">vs daily target</span></div><div class="panel-b flush">${regRows}</div></section>
        <section class="panel"><div class="panel-h"><h2>Integration health</h2><div class="actions"><button class="btn sm" data-go="integrations">All</button></div></div>
          <div class="panel-b flush">${CP.table([
            { h: 'Service', f: (i) => `<b>${i.name}</b><div class="cell-sub">${i.cat}</div>` },
            { h: 'Status', f: (i) => B(i.status) },
            { h: 'p95', r: 1, f: (i) => (i.latency ? i.latency + ' ms' : '—') },
          ], D.integrations.filter((i) => i.status !== 'Available').sort((a, b) => (a.health || 0) - (b.health || 0)).slice(0, 6))}</div></section>
        <section class="panel"><div class="panel-h"><h2>Offline & sync</h2><span class="sub">Store-and-forward queue</span></div>
          <div class="panel-b stack">
            <dl class="kv"><dt>Devices online</dt><dd class="num">1,402 / 1,431</dd><dt>Trading offline</dt><dd class="num">5 devices · 1 store</dd><dt>Queued transactions</dt><dd class="num">44</dd><dt>Oldest unsynced</dt><dd>41 min · IT-MIL-005</dd><dt>Offline package</dt><dd><span class="tag">v8812</span> built 06:00 UTC</dd><dt>Number blocks low</dt><dd>2 devices &lt; 50 left</dd></dl>
            <div class="callout warn"><div><b>IT-MIL-005 is selling offline.</b> Fiscal RT totals will be sent once the RT server reconnects. No action needed in store.</div></div>
          </div></section>
      </div>`;
    },
  };

  /* ================= Hierarchy ================= */
  let hierSel = { level: 'Global', id: 'GLOBAL' };
  function hierTree() {
    const sel = (l, id) => (hierSel.level === l && hierSel.id === id ? 'sel' : '');
    return `<div class="tree">
      <details open><summary class="${sel('Global', 'GLOBAL')}" data-node="Global|GLOBAL"><b>Atlas Retail Group</b><span class="lvl">Global</span></summary>
      ${D.regions.map((r) => `<details ${r.id === 'EMEA' ? 'open' : ''}><summary class="${sel('Region', r.id)}" data-node="Region|${r.id}">${r.id} <span class="muted small">${r.name}</span><span class="lvl">Region</span></summary>

      ['Global', 'GLOBAL', 'Global'],
      ['Region', sc.region, sc.region || ''],
      ['Country', sc.country, sc.country ? CP.country(sc.country).name : ''],
      ['Brand', sc.brand, sc.brand ? CP.brand(sc.brand).name : ''],
      ['Store', sc.store, sc.store || ''],
    ];
    let eff = null, effI = -1, lockedAt = null;
    levels.forEach(([lv, id], i) => {
      const key = lv === 'Global' ? 'Global' : id;
      if (key && k.v[key] !== undefined && !lockedAt) { eff = k.v[key]; effI = i; }
      if (key && k.lock[key]) lockedAt = lockedAt || lv;
    });
    const show = (v) => (v === true ? 'Yes' : v === false ? 'No' : v);
    const html = levels.map(([lv, id, name], i) => {
      const key = lv === 'Global' ? 'Global' : id;
      const has = key && k.v[key] !== undefined;
      const val = !key ? `<span class="inh">Pick a ${lv.toLowerCase()} in the scope bar</span>` : has ? E(show(k.v[key])) : '<span class="inh">inherits</span>';
      return `<div class="lv ${has ? 'set' : ''} ${i === effI ? 'eff' : ''}"><div class="lvn"><div class="eyebrow">${lv}</div><div class="small">${E(name)}</div></div><div class="val">${val}</div>
        <div>${key && k.lock[key] ? `<span class="lock">${I('lock').replace('<svg', '<svg width="12" height="12"')}Locked here</span>` : i === effI ? B('Effective', 'accent') : ''}</div></div>`;
    }).join('');
    return { html, eff: eff === null ? 'Not set' : show(eff), lockedAt };
  }
  S.config = {

<script>

   Payment providers, Tender rules, Customer settings, Privacy requests. */
(function () {
  const D = CP.data, S = CP.screens, I = CP.icon, B = CP.badge, E = CP.esc;

  /* Country picker chips limited to the current scope. */
  function countryChips(id, sel, filter = () => true) {
    const cs = CP.countriesInScope().filter(filter);
    return `<div class="chips" data-chips id="${id}">${cs.map((c) => `<button class="chip ${c.id === sel ? 'on' : ''}" data-v="${c.id}">${c.id} · ${c.name}</button>`).join('')}</div>`;
  }
  function pickCountry(sel, filter = () => true) {
    const cs = CP.countriesInScope().filter(filter);

        <section class="panel"><div class="panel-h"><h2>Retention</h2></div><div class="panel-b flush">${CP.table([{ h: 'Data', f: (r) => r[0] }, { h: 'Kept for', f: (r) => r[1] }, { h: 'Then', f: (r) => r[2] }], [['Customer profile (inactive)', '3 years', 'Anonymise'], ['Transactions', '10 years (DE/IT) · 7 years default', 'Archive'], ['Fiscal journal', 'Per country law', 'Write-once archive'], ['Audit log', '7 years', 'Archive to SIEM'], ['Device logs', '90 days', 'Delete']])}</div></section>
      </div>`;

})();

<script>

(function () {

  /* ================= Devices ================= */

          { h: 'Device', f: (d) => `<b class="mono">${d.id}</b><div class="cell-sub">${d.model} · ${d.os}</div>` }, { h: 'Store', f: (d) => `<span class="mono small">${d.store}</span>` },

          <dl class="kv"><dt>Operating system</dt><dd>${d.os}</dd><dt>Core POS app</dt><dd>${d.app}</dd><dt>MDM</dt><dd>${d.os.startsWith('Android') ? 'Microsoft Intune' : 'Jamf Pro'} · supervised</dd><dt>Device certificate</dt><dd class="mono small">mTLS · expires 2027-03-02</dd><dt>Payment terminal</dt><dd class="mono">${d.poiid}</dd><dt>Printer</dt><dd>${d.printer}</dd><dt>Offline queue</dt><dd>${d.state === 'Offline' ? '22 transactions' : '0'}</dd><dt>Number block</dt><dd class="mono">004001–005000 · 118 left</dd><dt>Signed-in associate</dt><dd>#1182 (PIN)</dd></dl>

      <section class="panel"><div class="toolbar"><input class="input" placeholder="Search user, store, transaction or key" aria-label="Search audit log" style="flex:1;min-width:200px">

          <label class="row">${CP.switch('bio', true, 'Biometric switch')}<span class="small">Allow Face ID / fingerprint for fast user switching</span></label><label class="row">${CP.switch('badge', false, 'Badge login')}<span class="small">Badge (NFC) login</span></label></div></section>

<script>
/* Screen: Transactions journal. Search and filter every completed sale, return,
   exchange, post-void and endless-aisle order across the hierarchy, then open one
   to see lines, tax, tenders, fiscal signature and downstream postings. */
(function () {
  const D = CP.data, S = CP.screens, I = CP.icon, B = CP.badge, E = CP.esc;

  /* ---------- Sample journal (deterministic, generated once) ---------- */
  const FX = { USD: 1, EUR: 1.0842, GBP: 1.297, JPY: 0.00669, CAD: 0.7291, AUD: 0.6612, CHF: 1.131, INR: 0.01195, SGD: 0.748, MYR: 0.2241 };
  const BASE = { 'ATL-W-40221': 395, 'ATL-W-40198': 595, 'KES-L-11804': 495, 'KES-L-11290': 129, 'NOR-W-00712': 189, 'ATL-S-ENGRV': 25, 'ATL-GC-VAR': 100, 'KES-L-10022': 345 };
  const VAT = { DE: 19, AT: 20, FR: 20, IT: 22, ES: 21, GB: 20, CH: 8.1, JP: 10, AU: 10, SG: 9, IN: 18, MY: 10, US: 8.875, CA: 13 };
  const FIRST = ['Anna', 'Lukas', 'Emma', 'Noah', 'Mia', 'Léa', 'Giulia', 'Hiro', 'Yuki', 'Olivia', 'Liam', 'Aarav', 'Priya', 'Chloe', 'Wei', 'Sofia', 'Jack', 'Isla'];
  const LAST = ['Becker', 'Martin', 'Rossi', 'García', 'Smith', 'Tanaka', 'Sato', 'Brown', 'Sharma', 'Tan', 'Wilson', 'Novak', 'Dubois', 'Lee'];

  function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const r = rng(20261013);
  const pick = (a) => a[Math.floor(r() * a.length)];
  const localPrice = (usd, cur) => {
    const v = usd / FX[cur];
    if (cur === 'JPY') return Math.round(v / 100) * 100;
    if (cur === 'INR') return Math.round(v / 5) * 5;
    return Math.round(v) - (v > 50 ? 0.01 : 0);
  };

  const TX = [];
  D.stores.forEach((s, si) => {
    const c = CP.country(s.country), cur = c.currency;
    const brandSkus = Object.keys(BASE).filter((k) => k.startsWith(s.brand) || (s.brand === 'NOR' && k.startsWith('NOR')) || k === 'ATL-GC-VAR');
    const n = 12 + Math.floor(r() * 6);
    let seq = 4000 + si * 37;
    for (let k = 0; k < n; k++) {
      const roll = r();
      const type = roll < 0.74 ? 'Sale' : roll < 0.84 ? 'Return' : roll < 0.89 ? 'Exchange' : roll < 0.91 ? 'Post-void' : 'Endless aisle';
      const day = k < 5 ? 0 : Math.floor(r() * 7);
      const hour = 10 + Math.floor(r() * 10), min = Math.floor(r() * 60);
      const nLines = type === 'Return' ? 1 : 1 + Math.floor(r() * (type === 'Exchange' ? 2 : 3));
      const lines = [];
      for (let l = 0; l < nLines; l++) {
        const sku = type === 'Exchange' && l === 0 ? brandSkus[0] : pick(brandSkus);
        const p = D.products.find((x) => x.sku === sku);
        const price = sku === 'ATL-GC-VAR' ? Math.max(1, Math.round(BASE[sku] / FX[cur] / (cur === 'JPY' || cur === 'INR' ? 1000 : 50))) * (cur === 'JPY' || cur === 'INR' ? 1000 : 50) : localPrice(BASE[sku] * (s.concept === 'Outlet' ? 0.72 : 1), cur);
        const qty = sku === 'ATL-S-ENGRV' || r() > 0.9 ? 1 + (r() > 0.7 ? 1 : 0) : 1;
        const disc = r() < 0.18 ? Math.round(price * qty * (r() < 0.5 ? 0.1 : 0.15) * 100) / 100 : 0;
        const sign = type === 'Return' || (type === 'Exchange' && l === 0) ? -1 : 1;
        lines.push({ sku, name: p.name, qty: qty * sign, price, disc: disc * sign, net: (price * qty - disc) * sign, discReason: disc ? pick(['Manual · damaged box', 'Manual · loyalty goodwill', 'Promo PR-24102', 'Employee 40%']) : '' });
      }
      let total = Math.round(lines.reduce((a, b) => a + b.net, 0) * 100) / 100;
      if (type === 'Post-void') total = 0;
      const taxRate = VAT[s.country];
      const tax = c.taxMode === 'inclusive' ? total - total / (1 + taxRate / 100) : total * (taxRate / 100);
      const gross = c.taxMode === 'inclusive' ? total : total + tax;
      const tRoll = r();
      const tender = Math.abs(gross) < 0.01 ? 'None' : tRoll < 0.62 ? 'Card' : tRoll < 0.76 ? 'Cash' : tRoll < 0.84 ? 'Wallet' : tRoll < 0.9 ? 'Gift card' : tRoll < 0.95 ? 'Store credit' : 'Split';
      const offline = s.status === 'Offline' && day === 0 && k < 4;
      const status = type === 'Post-void' ? 'Voided' : offline ? 'Pending sync' : r() < 0.025 ? 'Posting failed' : 'Completed';
      const known = r() < 0.55;
      const d = new Date(Date.UTC(2026, 9, 13 - day, hour, min));
      const devN = 1 + Math.floor(r() * Math.max(1, Math.min(s.devices, 4)));
      seq += 1 + Math.floor(r() * 9);
      TX.push({
        id: `${s.code.slice(-3)}-0${devN}-${String(seq).padStart(6, '0')}`,
        store: s.code, country: s.country, region: c.region, brand: s.brand, currency: cur, day,
        date: d, local: `${String(13 - day).padStart(2, '0')} Oct · ${String(hour).padStart(2, '0')}:${String(min).padStart(2, '0')}`,
        type, channel: type === 'Endless aisle' ? 'Endless aisle' : 'In store', lines, total: gross, tax, taxRate, tender, status,
        usd: gross * FX[cur], device: `D-${s.code.split('-')[1]}${s.code.slice(-1)}-0${devN}`,
        associate: '#' + (1100 + Math.floor(r() * 90)), customer: known ? `${pick(FIRST)} ${pick(LAST)}` : null, loyalty: known ? pick(['Gold', 'Silver', 'Member', 'Platinum']) : null,
        manualDisc: lines.some((l) => l.discReason.startsWith('Manual')), approval: type === 'Post-void' || (type === 'Return' && r() < 0.4) || lines.some((l) => l.discReason.startsWith('Manual') && r() < 0.5),
        psp: tender === 'Card' || tender === 'Wallet' || tender === 'Split' ? `88${Math.floor(1e13 + r() * 9e13)}` : null,
        card: pick(['VISA •••• 4417', 'MC •••• 9021', 'AMEX •••• 1008', 'JCB •••• 3350', 'Apple Pay · VISA •••• 7731']),
      });
    }
  });
  TX.sort((a, b) => b.date - a.date);
  CP.data.transactions = TX;

  const fmt = (v, cur) => {
    const c = D.countries.find((x) => x.currency === cur) || { lang: 'en-US' };
    return new Intl.NumberFormat(c.lang.split(',')[0], { style: 'currency', currency: cur, maximumFractionDigits: cur === 'JPY' || cur === 'INR' ? 0 : 2 }).format(v);
  };
  const usd = (v) => (v < 0 ? '−' : '') + '$' + Math.abs(v).toLocaleString('en-US', { maximumFractionDigits: 0 });

  /* ---------- Filter state (hierarchy part mirrors the scope bar) ---------- */
  const F = { date: '7d', types: [], status: 'Any', tender: 'Any', channel: 'Any', min: '', max: '', q: '', manual: false, approval: false, sort: 'date', dir: -1, page: 0 };
  const PAGE = 25;
  const TYPES = ['Sale', 'Return', 'Exchange', 'Post-void', 'Endless aisle'];
  const VIEWS = {
    'All transactions': { date: '7d', types: [], status: 'Any', tender: 'Any', manual: false, approval: false, min: '' },
    'Returns needing review': { date: '7d', types: ['Return'], status: 'Any', approval: true },
    'Manual discounts today': { date: 'today', types: [], manual: true },
    'Post-voids this week': { date: '7d', types: ['Post-void'] },
    'Failed or unsynced': { date: '7d', types: [], status: 'Problems' },
    'High-value sales (>$500)': { date: '7d', types: ['Sale'], min: '500' },
  };

  function filtered() {
    const maxDay = { today: 0, yesterday: 1, '7d': 6 }[F.date];
    const minDay = F.date === 'yesterday' ? 1 : 0;
    const q = F.q.trim().toLowerCase();
    let list = TX.filter((t) => {
      const s = D.stores.find((x) => x.code === t.store);
      if (!CP.inScope(s)) return false;
      if (t.day > maxDay || t.day < minDay) return false;
      if (F.types.length && !F.types.includes(t.type)) return false;
      if (F.status === 'Problems' ? !['Pending sync', 'Posting failed'].includes(t.status) : F.status !== 'Any' && t.status !== F.status) return false;
      if (F.tender !== 'Any' && t.tender !== F.tender) return false;
      if (F.channel !== 'Any' && t.channel !== F.channel) return false;
      if (F.min !== '' && Math.abs(t.usd) < +F.min) return false;
      if (F.max !== '' && Math.abs(t.usd) > +F.max) return false;
      if (F.manual && !t.manualDisc) return false;
      if (F.approval && !t.approval) return false;
      if (q && !(t.id + t.store + (t.customer || '') + (t.psp || '') + t.associate + t.lines.map((l) => l.sku + l.name).join(' ')).toLowerCase().includes(q)) return false;
      return true;
    });
    const key = { date: (t) => t.date, amount: (t) => t.usd, store: (t) => t.store, type: (t) => t.type }[F.sort];
    list = list.slice().sort((a, b) => (key(a) > key(b) ? 1 : key(a) < key(b) ? -1 : 0) * F.dir);
    return list;
  }

  function summary(list) {
    const sales = list.filter((t) => t.usd > 0).reduce((a, t) => a + t.usd, 0);
    const refunds = list.filter((t) => t.usd < 0).reduce((a, t) => a + t.usd, 0);
    const saleCount = list.filter((t) => t.type === 'Sale' || t.type === 'Endless aisle').length;
    const units = list.filter((t) => t.type === 'Sale').reduce((a, t) => a + t.lines.reduce((x, l) => x + l.qty, 0), 0);
    return [
      ['Transactions', list.length.toLocaleString('en-US'), `${saleCount} sales · ${list.filter((t) => t.type === 'Return').length} returns`],
      ['Gross sales', usd(sales), 'USD reporting currency'],
      ['Refunds', usd(refunds), `${sales ? Math.round((-refunds / sales) * 1000) / 10 : 0}% of gross`],
      ['Net sales', usd(sales + refunds), `ATV ${usd(saleCount ? sales / saleCount : 0)} · UPT ${saleCount ? (units / Math.max(1, list.filter((t) => t.type === 'Sale').length)).toFixed(2) : '0'}`],
      ['Need attention', list.filter((t) => ['Pending sync', 'Posting failed'].includes(t.status)).length, 'Unsynced or failed posting'],
    ];
  }

  const typeKind = { Sale: 'good', Return: 'warn', Exchange: 'info', 'Post-void': 'bad', 'Endless aisle': 'accent' };
  const statusKind = { Completed: 'good', 'Pending sync': 'warn', 'Posting failed': 'bad', Voided: '' };

  function tableHTML(list) {
    const pages = Math.max(1, Math.ceil(list.length / PAGE));
    F.page = Math.min(F.page, pages - 1);
    const rows = list.slice(F.page * PAGE, F.page * PAGE + PAGE);
    const th = (label, key, r) => key
      ? `<th class="${r ? 'r' : ''}"><button class="sortbtn" data-sort="${key}" aria-label="Sort by ${label}">${label}${F.sort === key ? (F.dir < 0 ? ' ↓' : ' ↑') : ''}</button></th>`
      : `<th class="${r ? 'r' : ''}">${label}</th>`;
    if (!list.length) return `<div class="empty-note" style="border-radius:0;padding:28px 16px;text-align:center">No transactions match these filters. <button class="btn sm" id="tx-clear2">Clear filters</button></div>`;
    return `<div class="tbl-wrap"><table class="tbl"><thead><tr>
        ${th('Date (local)', 'date')}${th('Receipt', '')}${th('Store', 'store')}${th('Type', 'type')}<th>Customer</th><th>Tender</th>${th('Amount', 'amount', 1)}<th class="r">USD</th><th>Status</th>
      </tr></thead><tbody>${rows.map((t) => `<tr class="click" data-tx="${t.store}|${t.id}" tabindex="0">
        <td class="mono small">${t.local}</td>
        <td><b class="mono">${t.id}</b><div class="cell-sub">${t.device} · ${t.associate}</div></td>
        <td>${CP.flag(t.country)} <span class="mono small">${t.store}</span><div class="cell-sub">${CP.brand(t.brand).name}</div></td>
        <td>${B(t.type, typeKind[t.type])}${t.manualDisc ? ' <span class="tag" title="Manual discount">%</span>' : ''}${t.approval ? ' <span class="tag" title="Manager approval">MGR</span>' : ''}</td>
        <td>${t.customer ? `${E(t.customer.split(' ')[0])} ${t.customer.split(' ')[1][0]}.<div class="cell-sub">${t.loyalty}</div>` : '<span class="muted small">Guest</span>'}</td>
        <td class="small">${t.tender}</td>
        <td class="r"><b class="num ${t.total < 0 ? 'down' : ''}">${fmt(t.total, t.currency)}</b></td>
        <td class="r num small muted">${usd(t.usd)}</td>
        <td>${B(t.status, statusKind[t.status])}</td></tr>`).join('')}</tbody></table></div>
      <div class="toolbar" style="border-top:1px solid var(--line);border-bottom:0;justify-content:space-between">
        <span class="small muted">${F.page * PAGE + 1}–${Math.min(list.length, (F.page + 1) * PAGE)} of ${list.length} sample transactions</span>
        <div class="row" style="gap:6px"><button class="btn sm" id="pg-prev" ${F.page ? '' : 'disabled'}>Previous</button><span class="mono small">${F.page + 1} / ${pages}</span><button class="btn sm" id="pg-next" ${F.page < pages - 1 ? '' : 'disabled'}>Next</button></div></div>`;
  }

  function activeChips() {
    const sc = CP.scope, out = [];
    if (sc.region) out.push(['Region: ' + sc.region, 'region']);
    if (sc.country) out.push(['Country: ' + CP.country(sc.country).name, 'country']);
    if (sc.brand) out.push(['Brand: ' + CP.brand(sc.brand).name, 'brand']);
    if (sc.store) out.push(['Store: ' + sc.store, 'store']);
    F.types.forEach((t) => out.push(['Type: ' + t, 'type:' + t]));
    if (F.status !== 'Any') out.push(['Status: ' + (F.status === 'Problems' ? 'Unsynced or failed' : F.status), 'status']);
    if (F.tender !== 'Any') out.push(['Tender: ' + F.tender, 'tender']);
    if (F.channel !== 'Any') out.push(['Channel: ' + F.channel, 'channel']);
    if (F.min !== '' || F.max !== '') out.push([`Amount: ${F.min || 0}–${F.max || '∞'} USD`, 'amount']);
    if (F.manual) out.push(['Manual discount', 'manual']);
    if (F.approval) out.push(['Manager approval', 'approval']);
    if (F.q) out.push([`Search: “${F.q}”`, 'q']);
    return out;
  }

  S.transactions = {
    render() {
      const sc = CP.scope, list = filtered();
      const opt = (v, l, sel) => `<option value="${v}" ${sel === v ? 'selected' : ''}>${E(l)}</option>`;
      const countries = D.countries.filter((c) => !sc.region || c.region === sc.region);
      const stores = D.stores.filter((s) => (!sc.region || CP.country(s.country).region === sc.region) && (!sc.country || s.country === sc.country) && (!sc.brand || s.brand === sc.brand));
      const chips = activeChips();
      return `${CP.pageHead({ crumbs: ['Overview'], title: 'Transactions', scoped: false, desc: 'Every sale, return, exchange, post-void and endless-aisle order, read-only and immutable. Filter by any level of the hierarchy, open a transaction to see its lines, tax, tenders, fiscal signature and where it was posted.', actions: `<select class="input" id="tx-view" aria-label="Saved view">${Object.keys(VIEWS).map((v) => `<option>${v}</option>`).join('')}</select><button class="btn" data-toast="Export of ${list.length} transactions queued. You'll get an email with the CSV.">${I('download')}Export CSV</button>` })}
      <section class="panel">
        <div class="toolbar" style="gap:10px;align-items:flex-end">
          <div class="field"><label for="tx-region">Region</label><select class="input" id="tx-region">${opt('', 'All regions', sc.region)}${D.regions.map((r) => opt(r.id, r.id, sc.region)).join('')}</select></div>
          <div class="field"><label for="tx-country">Country</label><select class="input" id="tx-country">${opt('', 'All countries', sc.country)}${countries.map((c) => opt(c.id, c.name, sc.country)).join('')}</select></div>
          <div class="field"><label for="tx-brand">Brand</label><select class="input" id="tx-brand">${opt('', 'All brands', sc.brand)}${D.brands.map((b) => opt(b.id, b.name, sc.brand)).join('')}</select></div>
          <div class="field"><label for="tx-store">Store</label><select class="input" id="tx-store">${opt('', 'All stores', sc.store)}${stores.map((s) => opt(s.code, `${s.code} · ${s.name}`, sc.store)).join('')}</select></div>
          <div class="field"><label for="tx-date">Business day</label><select class="input" id="tx-date">${opt('today', 'Today', F.date)}${opt('yesterday', 'Yesterday', F.date)}${opt('7d', 'Last 7 days', F.date)}</select></div>
          <div class="field" style="flex:1;min-width:200px"><label for="tx-q">Search</label><input class="input" id="tx-q" value="${E(F.q)}" placeholder="Receipt no., customer, PSP ref, SKU, associate"></div>
        </div>
        <div class="toolbar" style="gap:10px;align-items:flex-end">
          <div class="field"><label>Type</label><div class="chips" data-chips="multi" id="tx-types">${TYPES.map((t) => `<button class="chip ${F.types.includes(t) ? 'on' : ''}" data-v="${t}">${t}</button>`).join('')}</div></div>
          <div class="field"><label for="tx-status">Status</label><select class="input" id="tx-status">${['Any', 'Completed', 'Pending sync', 'Posting failed', 'Voided'].map((s) => opt(s, s, F.status)).join('')}${opt('Problems', 'Unsynced or failed', F.status)}</select></div>
          <div class="field"><label for="tx-tender">Tender</label><select class="input" id="tx-tender">${['Any', 'Card', 'Wallet', 'Cash', 'Gift card', 'Store credit', 'Split'].map((s) => opt(s, s, F.tender)).join('')}</select></div>
          <div class="field"><label for="tx-channel">Channel</label><select class="input" id="tx-channel">${['Any', 'In store', 'Endless aisle'].map((s) => opt(s, s, F.channel)).join('')}</select></div>
          <div class="field"><label for="tx-min">Amount (USD)</label><div class="row" style="gap:4px;flex-wrap:nowrap"><input class="input mono" id="tx-min" value="${F.min}" placeholder="Min" style="width:76px"><span class="muted">–</span><input class="input mono" id="tx-max" value="${F.max}" placeholder="Max" style="width:76px" aria-label="Maximum amount"></div></div>
          <label class="row small" style="gap:6px;padding-bottom:6px">${CP.switch('tx-manual', F.manual, 'Manual discount only')} Manual discount</label>
          <label class="row small" style="gap:6px;padding-bottom:6px">${CP.switch('tx-appr', F.approval, 'Manager approval only')} Manager approval</label>
        </div>
        ${chips.length ? `<div class="toolbar" style="gap:6px"><span class="small muted">Filtered by</span>${chips.map(([l, k]) => `<button class="chip on" data-rm="${k}" aria-label="Remove filter ${E(l)}">${E(l)} ✕</button>`).join('')}<button class="btn sm ghost" id="tx-clear">Clear all</button></div>` : ''}
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;border-bottom:1px solid var(--line)">
          ${summary(list).map(([a, b, c], i) => `<div class="kpi" style="${i ? 'border-left:1px solid var(--line)' : ''}"><div class="eyebrow">${a}</div><div class="v" style="font-size:1.3rem">${b}</div><div class="d">${c}</div></div>`).join('')}
        </div>
        <div id="tx-table">${tableHTML(list)}</div>
      </section>`;
    },
    mount(root) {
      const rerender = () => CP.render();
      const setScope = (patch) => { F.page = 0; CP.setScope(patch); };
      root.querySelector('#tx-region').onchange = (e) => setScope({ region: e.target.value, country: '', store: '' });
      root.querySelector('#tx-country').onchange = (e) => setScope({ country: e.target.value, store: '', region: e.target.value ? CP.country(e.target.value).region : CP.scope.region });
      root.querySelector('#tx-brand').onchange = (e) => setScope({ brand: e.target.value, store: '' });
      root.querySelector('#tx-store').onchange = (e) => {
        const s = D.stores.find((x) => x.code === e.target.value);
        setScope(s ? { store: s.code, country: s.country, region: CP.country(s.country).region, brand: s.brand } : { store: '' });
      };
      const bindSel = (id, key) => (root.querySelector(id).onchange = (e) => { F[key] = e.target.value; F.page = 0; rerender(); });
      bindSel('#tx-date', 'date'); bindSel('#tx-status', 'status'); bindSel('#tx-tender', 'tender'); bindSel('#tx-channel', 'channel');
      root.querySelector('#tx-types').addEventListener('chips', (e) => { const v = e.detail; F.types = F.types.includes(v) ? F.types.filter((x) => x !== v) : [...F.types, v]; F.page = 0; rerender(); });
      root.querySelector('#tx-manual').onchange = (e) => { F.manual = e.target.checked; F.page = 0; rerender(); };
      root.querySelector('#tx-appr').onchange = (e) => { F.approval = e.target.checked; F.page = 0; rerender(); };
      ['min', 'max'].forEach((k) => (root.querySelector('#tx-' + k).onchange = (e) => { F[k] = e.target.value.replace(/[^\d.]/g, ''); F.page = 0; rerender(); }));
      let qt;
      const q = root.querySelector('#tx-q');
      q.oninput = () => { clearTimeout(qt); qt = setTimeout(() => { F.q = q.value; F.page = 0; rerender(); const n = document.getElementById('tx-q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 300); };
      const clearAll = () => { Object.assign(F, { types: [], status: 'Any', tender: 'Any', channel: 'Any', min: '', max: '', q: '', manual: false, approval: false, page: 0 }); setScope({ region: '', country: '', brand: '', store: '' }); };
      root.querySelector('#tx-clear')?.addEventListener('click', clearAll);
      root.querySelector('#tx-clear2')?.addEventListener('click', clearAll);
      root.querySelectorAll('[data-rm]').forEach((b) => (b.onclick = () => {
        const k = b.dataset.rm;
        if (['region', 'country', 'brand', 'store'].includes(k)) return setScope(k === 'region' ? { region: '', country: '', store: '' } : k === 'country' ? { country: '', store: '' } : { [k]: '' , store: '' });
        if (k.startsWith('type:')) F.types = F.types.filter((t) => t !== k.slice(5));
        else if (k === 'amount') { F.min = ''; F.max = ''; }
        else if (k === 'manual' || k === 'approval') F[k] = false;
        else if (k === 'q') F.q = '';
        else F[k] = 'Any';
        F.page = 0; rerender();
      }));
      const view = root.querySelector('#tx-view');
      view.onchange = () => { Object.assign(F, { types: [], status: 'Any', tender: 'Any', channel: 'Any', min: '', max: '', q: '', manual: false, approval: false, page: 0 }, VIEWS[view.value]); rerender(); CP.toast('Saved view: ' + view.value); };
      const bindTable = () => {
        const tb = root.querySelector('#tx-table');
        tb.querySelectorAll('[data-sort]').forEach((b) => (b.onclick = () => { const k = b.dataset.sort; F.dir = F.sort === k ? -F.dir : -1; F.sort = k; tb.innerHTML = tableHTML(filtered()); bindTable(); }));
        tb.querySelector('#pg-prev')?.addEventListener('click', () => { F.page--; tb.innerHTML = tableHTML(filtered()); bindTable(); root.querySelector('#tx-table').scrollIntoView({ block: 'start' }); });
        tb.querySelector('#pg-next')?.addEventListener('click', () => { F.page++; tb.innerHTML = tableHTML(filtered()); bindTable(); root.querySelector('#tx-table').scrollIntoView({ block: 'start' }); });
        tb.querySelectorAll('[data-tx]').forEach((tr) => {
          const open = () => { const [st, id] = tr.dataset.tx.split('|'); txDrawer(TX.find((t) => t.store === st && t.id === id)); };
          tr.onclick = open; tr.onkeydown = (e) => e.key === 'Enter' && open();
        });
        tb.querySelector('#tx-clear2')?.addEventListener('click', clearAll);
      };
      bindTable();
    },
  };

  /* ---------- Detail drawer ---------- */
  function txDrawer(t) {
    const s = D.stores.find((x) => x.code === t.store), c = CP.country(t.country);
    const ext = c.tax.startsWith('Avalara');
    const sub = t.lines.reduce((a, l) => a + l.price * l.qty, 0);
    const disc = t.lines.reduce((a, l) => a + l.disc, 0);
    const fiscal = c.fiscal ? {
      DE: ['TSE signature', 'fiskaly · TSS 9b1e…c204 · counter ' + (88000 + parseInt(t.id.slice(-4)))], AT: ['RKSV signature', 'Chain OK · Kassen-ID AT-' + t.store.slice(-3)], FR: ['NF525', 'Hash chained · signature X7aQ…p2'],
      IT: ['RT document', t.status === 'Pending sync' ? 'Pending · RT server unreachable' : 'RT 99MEX018442 · n. ' + t.id.slice(-4)], ES: ['VeriFactu', 'Chained hash · QR issued'], JP: ['Qualified invoice', 'T1234567890123'], IN: ['GST invoice', 'GSTIN 29ABCDE1234F1Z5'], MY: ['MyInvois', 'Consolidated monthly'],
    }[c.id] : null;
    const timeline = [
      ['Completed on device', `${t.device} · ${t.local} local`, 'good'],
      t.status === 'Pending sync' ? ['Waiting to sync', 'Device is offline. Stored and signed on the device.', 'warn'] : ['Synced to Core POS', 'Within 2 s · idempotency key ' + t.id, 'good'],
      ext ? ['Tax committed', 'Avalara AvaTax · doc ' + t.id, t.status === 'Pending sync' ? 'info' : 'good'] : null,
      fiscal ? ['Fiscal registration', fiscal[1], t.status === 'Pending sync' ? 'warn' : 'good'] : null,
      t.psp ? ['Payment captured', 'Adyen PSP ' + t.psp, 'good'] : null,
      ['Posted to SAP (TLOG)', t.status === 'Posting failed' ? '422 · Missing cost centre for store, in failed-message queue' : t.status === 'Pending sync' ? 'After sync' : 'Batch 2026-10-' + String(13 - t.day).padStart(2, '0') + ' · POSDM', t.status === 'Posting failed' ? 'bad' : t.status === 'Pending sync' ? 'info' : 'good'],
      ['Inventory delta to Fluent', t.status === 'Pending sync' ? 'After sync' : 'Sent in 3 s', t.status === 'Pending sync' ? 'info' : 'good'],
      t.customer ? ['Customer event to Amperity', 'TransactionCompleted.v3', t.status === 'Pending sync' ? 'info' : 'good'] : null,
    ].filter(Boolean);
    const dot = { good: 'var(--good)', warn: 'var(--warn)', bad: 'var(--bad)', info: 'var(--fg-3)' };
    CP.drawer({
      title: `${t.type} ${t.id}`, sub: `${t.store} · ${s.name} · ${t.local}`,
      body: `<div class="row">${B(t.type, typeKind[t.type])}${B(t.status, statusKind[t.status])}${t.approval ? B('Manager approved', 'info') : ''}<span class="spacer"></span><b class="num" style="font-size:1.3rem">${fmt(t.total, t.currency)}</b></div>
        ${t.status === 'Posting failed' ? `<div class="callout warn"><div><b>SAP rejected this transaction.</b> Fix the store's cost centre mapping, then retry. The transaction itself is final and cannot be edited.</div></div>` : ''}
        ${t.status === 'Pending sync' ? `<div class="callout warn"><div><b>Not synced yet.</b> ${t.store} is trading offline. This transaction will arrive with its original time and number when the device reconnects.</div></div>` : ''}
        <div class="stack"><h3>Items</h3>${CP.table([
          { h: 'Item', f: (l) => `${E(l.name)}<div class="cell-sub mono">${l.sku}</div>${l.discReason ? `<div class="cell-sub">${l.discReason}</div>` : ''}` },
          { h: 'Qty', r: 1, f: (l) => l.qty }, { h: 'Price', r: 1, f: (l) => fmt(l.price, t.currency) },
          { h: 'Discount', r: 1, f: (l) => (l.disc ? `<span class="down">−${fmt(Math.abs(l.disc), t.currency)}</span>` : '<span class="muted">—</span>') },
          { h: 'Net', r: 1, f: (l) => `<b>${fmt(l.net, t.currency)}</b>` }], t.lines)}</div>
        <dl class="kv">
          <dt>Subtotal</dt><dd class="num">${fmt(sub, t.currency)}</dd>
          <dt>Discounts</dt><dd class="num">${disc ? '−' + fmt(Math.abs(disc), t.currency) : '—'}</dd>
          <dt>${c.taxMode === 'inclusive' ? 'Included tax' : 'Sales tax'}</dt><dd class="num">${fmt(t.tax, t.currency)} <span class="muted small">(${ext ? 'Avalara, ' : ''}${t.taxRate}%)</span></dd>
          <dt>Total</dt><dd class="num"><b>${fmt(t.total, t.currency)}</b> <span class="muted small">≈ ${usd(t.usd)} at ${FX[t.currency]} USD</span></dd>
        </dl>
        <div class="grid g2">
          <div class="stack"><h3>Payment</h3><dl class="kv"><dt>Tender</dt><dd>${t.tender}</dd>${t.psp ? `<dt>Card</dt><dd class="mono small">${t.card}</dd><dt>PSP reference</dt><dd class="mono small">${t.psp}</dd><dt>Terminal</dt><dd class="mono small">${D.devices.find((d) => d.store === t.store)?.poiid || 'S1F2-000' + t.store.slice(-3) + '01'}</dd>` : ''}${t.tender === 'Cash' ? `<dt>Drawer</dt><dd>Drawer 1 · change given in ${t.currency}</dd>` : ''}</dl></div>
          <div class="stack"><h3>People</h3><dl class="kv"><dt>Associate</dt><dd>${t.associate}${t.lines.length > 1 && t.type === 'Sale' ? ' (split 50/50 with ' + (t.associate === '#1121' ? '#1122' : '#1121') + ')' : ''}</dd><dt>Customer</dt><dd>${t.customer ? `${E(t.customer.split(' ')[0])} ${t.customer.split(' ')[1][0]}. · ${t.loyalty}<br><span class="small muted">j•••@g•••.com · +•• •••• ${t.id.slice(-4)}</span>` : 'Guest'}</dd>${t.approval ? `<dt>Approved by</dt><dd>Store Manager #1003 · PIN on device</dd>` : ''}</dl>
            ${t.customer ? '<button class="btn sm" id="tx-reveal">' + I('eye') + 'Reveal contact (logged)</button>' : ''}</div>
        </div>
        ${fiscal ? `<div class="stack"><h3>Fiscal</h3><dl class="kv"><dt>${fiscal[0]}</dt><dd class="mono small">${fiscal[1]}</dd><dt>Journal</dt><dd>Write-once, hash-chained</dd></dl></div>` : ''}
        <div class="stack"><h3>Where it went</h3>
          <div class="list">${timeline.map(([a, b, k]) => `<div class="list-item" style="padding:8px 0;border-bottom:0"><span style="width:10px;height:10px;border-radius:50%;background:${dot[k]};margin-top:5px;flex:none"></span><div class="grow"><b class="small">${a}</b><div class="small muted">${E(b)}</div></div></div>`).join('')}</div></div>`,
      foot: `${t.status === 'Posting failed' ? '<button class="btn" id="tx-retry">' + I('refresh') + 'Retry posting</button>' : ''}<span class="spacer"></span><button class="btn" data-toast="Receipt copy emailed to the customer">Email receipt</button><button class="btn" data-toast="Receipt copy sent to ${t.device}">Reprint</button>${t.type === 'Sale' && t.psp ? '<button class="btn primary" id="tx-refund">Referenced refund</button>' : ''}`,
      mount(d) {
        d.querySelector('#tx-reveal')?.addEventListener('click', (e) => { e.currentTarget.outerHTML = `<div class="small">${E(t.customer.toLowerCase().replace(' ', '.'))}@example.com · +44 7700 90${t.id.slice(-4)}<div class="muted">Reveal logged to audit as Priya Raman</div></div>`; });
        d.querySelector('#tx-retry')?.addEventListener('click', () => CP.toast('Re-posted to SAP. Accepted.'));
        d.querySelector('#tx-refund')?.addEventListener('click', () => CP.confirm({ title: `Refund ${fmt(t.total, t.currency)}?`, body: `A referenced refund goes back to ${t.card} through Adyen without the card present. It creates a linked return document and needs Finance approval above ${fmt(localPrice(300, t.currency), t.currency)}.`, confirm: 'Start refund', onConfirm: () => CP.toast('Refund request created and sent for approval') }));
      },
    });
  }
})();
</script>
